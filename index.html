<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KM0 — Buscador de autos multi-sitio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__mark">KM0</span>
      <span class="topbar__sub">buscador multi-sitio</span>
    </div>
    <div class="topbar__sources">
      <span class="source-pill" data-source="meli">Mercado Libre</span>
      <span class="source-pill" data-source="seminuevos">Seminuevos</span>
      <span class="source-pill source-pill--soon" data-source="fb">Facebook Marketplace · pronto</span>
    </div>
  </header>

  <section class="search-panel">
    <form id="search-form" class="search-form">
      <div class="field">
        <label for="marca">Marca</label>
        <input type="text" id="marca" name="marca" placeholder="Ej. Nissan" required>
      </div>
      <div class="field">
        <label for="modelo">Modelo</label>
        <input type="text" id="modelo" name="modelo" placeholder="Ej. Sentra" required>
      </div>
      <div class="field field--year">
        <label for="anio">Año</label>
        <input type="number" id="anio" name="anio" placeholder="2018" min="1980" max="2027" required>
      </div>
      <button type="submit" class="btn-search">
        <span class="btn-search__label">Buscar</span>
        <span class="btn-search__gauge" aria-hidden="true"></span>
      </button>
    </form>
    <p class="search-status" id="search-status" aria-live="polite"></p>
  </section>

  <section class="market-summary" id="market-summary" hidden>
    <div class="market-summary__stat">
      <span class="market-summary__label">Promedio de mercado</span>
      <span class="market-summary__value" id="avg-price">—</span>
    </div>
    <div class="market-summary__stat">
      <span class="market-summary__label">Anuncios encontrados</span>
      <span class="market-summary__value" id="total-results">—</span>
    </div>
    <div class="market-summary__stat">
      <span class="market-summary__label">Estimado de reventa</span>
      <span class="market-summary__value" id="resale-estimate">—</span>
    </div>
  </section>

  <main class="results" id="results" aria-live="polite">
    <div class="results__empty" id="results-empty">
      <p>Busca una marca, modelo y año para empezar.</p>
    </div>
  </main>

  <template id="card-template">
    <article class="car-card">
      <div class="car-card__image-wrap">
        <img class="car-card__image" src="" alt="">
        <span class="car-card__source"></span>
      </div>
      <div class="car-card__body">
        <h3 class="car-card__title"></h3>
        <div class="car-card__price-row">
          <span class="car-card__price"></span>
          <span class="car-card__delta"></span>
        </div>
        <div class="car-card__meta">
          <span class="car-card__distance"></span>
          <span class="car-card__resale"></span>
        </div>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
